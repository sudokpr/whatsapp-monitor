groups:
  - name: whatsapp-group-monitor
    rules:
      - alert: WhatsAppMonitorDown
        expr: up{job="whatsapp-monitor"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: WhatsApp monitor scrape target is down
          description: Prometheus cannot scrape the WhatsApp monitor metrics endpoint.

      - alert: WhatsAppDisconnected
        expr: whatsapp_connection_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: WhatsApp connection is not open
          description: The monitor process is up, but the Baileys WhatsApp connection is not open.

      - alert: WhatsAppCaptureStalled
        expr: time() - whatsapp_last_message_timestamp_seconds > 4 * 60 * 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: WhatsApp message capture appears stalled
          description: No WhatsApp messages have been captured for more than 4 hours.

      - alert: WhatsAppDigestCronStalled
        expr: time() - whatsapp_digest_last_run_timestamp_seconds > 6 * 60 * 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: WhatsApp digest cron has not run recently
          description: The digest cron metrics have not been updated for more than 6 hours.

      - alert: WhatsAppDigestFailed
        expr: whatsapp_digest_last_failure_timestamp_seconds > whatsapp_digest_last_success_timestamp_seconds
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Latest WhatsApp digest run failed
          description: The most recent digest run failed after the last successful run.

      - alert: WhatsAppDigestNoTelegramSend
        expr: whatsapp_digest_telegram_enabled == 1 and whatsapp_digest_last_message_count > 0 and whatsapp_digest_last_sent_to_telegram == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: WhatsApp digest found messages but did not send Telegram
          description: The digest run found new messages but did not report a Telegram send.

      - alert: WhatsAppDigestNoWhatsAppSend
        expr: whatsapp_digest_whatsapp_enabled == 1 and whatsapp_digest_last_message_count > 0 and whatsapp_digest_last_sent_to_whatsapp == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: WhatsApp digest found messages but did not send WhatsApp
          description: The digest run found new messages but did not report a WhatsApp send.
