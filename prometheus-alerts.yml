groups:
  - name: whatsapp-group-monitor
    rules:
      - alert: WhatsAppMonitorDown
        expr: up{job="whatsapp-monitor"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: WhatsApp monitor scrape target is down
          description: Prometheus cannot scrape the WhatsApp monitor metrics endpoint.

      - alert: WhatsAppDisconnected
        expr: whatsapp_connection_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: WhatsApp connection is not open
          description: The monitor process is up, but the Baileys WhatsApp connection is not open.

      - alert: WhatsAppCaptureStalled
        expr: time() - whatsapp_last_message_timestamp_seconds > 4 * 60 * 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: WhatsApp message capture appears stalled
          description: No WhatsApp messages have been captured for more than 4 hours.

      - alert: WhatsAppPersistenceFailing
        expr: increase(whatsapp_message_persist_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: WhatsApp message persistence is failing
          description: The monitor has failed to persist one or more messages in the last 10 minutes.

      - alert: WhatsAppStorageLow
        expr: whatsapp_storage_free_bytes < 1024 * 1024 * 1024 or whatsapp_storage_free_bytes / whatsapp_storage_total_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: WhatsApp monitor storage is low
          description: The filesystem containing the monitor data directory has less than 1GB or 10% free space.

      - alert: WhatsAppImageAnalysisBacklog
        expr: whatsapp_image_analysis_queue_depth > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: WhatsApp image analysis backlog is growing
          description: More than 20 images are waiting in the image analysis queue.

      - alert: WhatsAppImageAnalysisFailing
        expr: whatsapp_image_analysis_last_failure_timestamp_seconds > whatsapp_image_analysis_last_success_timestamp_seconds
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Latest WhatsApp image analysis run failed
          description: The most recent image analysis processing attempt failed after the last successful run.

      - alert: WhatsAppDigestCronStalled
        expr: time() - whatsapp_digest_last_run_timestamp_seconds > 6 * 60 * 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: WhatsApp digest cron has not run recently
          description: The digest cron metrics have not been updated for more than 6 hours.

      - alert: WhatsAppDigestFailed
        expr: whatsapp_digest_last_failure_timestamp_seconds > whatsapp_digest_last_success_timestamp_seconds
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Latest WhatsApp digest run failed
          description: The most recent digest run failed after the last successful run.

      - alert: WhatsAppDigestPromptInjectionDetected
        expr: whatsapp_digest_last_suspected_prompt_injection_count > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: WhatsApp digest omitted suspected prompt-injection text
          description: The latest digest run omitted one or more current-window messages that matched prompt-injection guardrails.

      - alert: WhatsAppDigestNoTelegramSend
        expr: whatsapp_digest_telegram_enabled == 1 and whatsapp_digest_last_message_count > 0 and whatsapp_digest_last_sent_to_telegram == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: WhatsApp digest found messages but did not send Telegram
          description: The digest run found new messages but did not report a Telegram send.

      - alert: WhatsAppDigestNoWhatsAppSend
        expr: whatsapp_digest_whatsapp_enabled == 1 and whatsapp_digest_last_message_count > 0 and whatsapp_digest_last_sent_to_whatsapp == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: WhatsApp digest found messages but did not send WhatsApp
          description: The digest run found new messages but did not report a WhatsApp send.

      - alert: WhatsAppBackupMetricsMissing
        expr: absent(whatsapp_backup_last_run_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: WhatsApp backup metrics are missing
          description: Prometheus has not seen backup run metrics. Check the backup metrics Pushgateway configuration.

      - alert: WhatsAppBackupStalled
        expr: time() - whatsapp_backup_last_run_timestamp_seconds > 30 * 60 * 60
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: WhatsApp backup has not run recently
          description: The daily backup metrics have not been updated for more than 30 hours.

      - alert: WhatsAppBackupFailed
        expr: whatsapp_backup_last_failure_timestamp_seconds > whatsapp_backup_last_success_timestamp_seconds
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Latest WhatsApp backup failed
          description: The most recent backup run failed after the last successful run.
